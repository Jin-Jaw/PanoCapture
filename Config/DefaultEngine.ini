; Merged into the project's Engine config while the plugin is enabled.
; The Pano viewer server (ports 8765-8774) serves captured tours and must only listen on this machine,
; even if the project sets [HTTPServer.Listeners] DefaultBindAddress=any for something else.
[HTTPServer.Listeners]
+ListenerOverrides=(Port=8765,BindAddress="localhost")
+ListenerOverrides=(Port=8766,BindAddress="localhost")
+ListenerOverrides=(Port=8767,BindAddress="localhost")
+ListenerOverrides=(Port=8768,BindAddress="localhost")
+ListenerOverrides=(Port=8769,BindAddress="localhost")
+ListenerOverrides=(Port=8770,BindAddress="localhost")
+ListenerOverrides=(Port=8771,BindAddress="localhost")
+ListenerOverrides=(Port=8772,BindAddress="localhost")
+ListenerOverrides=(Port=8773,BindAddress="localhost")
+ListenerOverrides=(Port=8774,BindAddress="localhost")
